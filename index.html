<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="icon" sizes="any" href="./icon.png" type="image/png">
    <link rel="mask-icon" href="./icon.png" color="#4285f4">
    <link rel="apple-touch-icon" href="./icon.png">

    <title>CC</title>
    <style>
        
        html,
        body {
            overflow-x: hidden !important;
            overflow-y: auto;
            touch-action: pan-y;
            overscroll-behavior-x: none;
        }

        body>* {
            max-width: 100vw;
        }

        :root {
            --color-red: #e53e3e;
            --color-blue: #3182ce;
            --color-green: #38a169;
            --color-text: #2d3748;
            --color-text-secondary: #718096;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-blur: blur(20px);
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            --color-jin: #f0c820;
            --color-mu: #52c41a;
            --color-shui: #1890ff;
            --color-huo: #ff4d4f;
            --color-tu: #8c6c3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #e0f7fa 0%, #f3e5f5 50%, #fff3e0 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: var(--shadow);
        }

        .glass-container {
            width: 100%;
            max-width: 1200px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        /* 内容容器 */
        #contentWrapper {
            width: 100%;
            max-width: 1200px;
        }
    </style>
</head>

<body>
    <script src="./js/fHData.js"></script>

    <!-- 导航模板、导航CSS、数据源逻辑统一加载 -->
    <script src="./js/navTpl.js"></script>

    <!-- 内容区域 -->
    <div id="contentWrapper"></div>

    <!-- 页面内容脚本 -->
    <script src="./js/homeCt.js"></script>
    <script src="./js/sxCt.js"></script>
    <script src="./js/zcCt.js"></script>
    <script src="./js/tdCt.js"></script>
    <script src="./js/ptCt.js"></script>
    <script src="./js/rtCt.js"></script>
    <script src="./js/lsCt.js"></script>

    <script>
        
        // index.js
        (function() {
            window.currentPageKey = 'home'; 

            async function changePage(pageKey) {
                window.currentPageKey = pageKey; 
                
                const wrapper = document.getElementById('contentWrapper');
                wrapper.innerHTML = '';

                const styleIds = ['td-page-style', 'zc-page-style', 'pt-page-style', 'rt-page-style', 'ls-page-style'];
                styleIds.forEach(id => document.getElementById(id)?.remove());
                document.querySelectorAll('.glass-button, .sidebar-button').forEach(el => el.classList.remove('active'));

                const pageConfig = {
                    home: { html: getHomeHtml, init: initHomeTouch },
                    sx:   { html: getSxHtml,   init: initSxTouch },
                    td:   { html: getTdHtml,   init: initTdTouch },
                    rt:   { html: getRtHtml,   init: initRtTouch },
                    pt:   { html: getPtHtml,   init: initPtTouch },
                    zc:   { html: getZcHtml,   init: initZcTouch },
                    ls:   { html: getLsHtml,   init: initLsTouch }
                };

                const config = pageConfig[pageKey];
                if (config) {
                    wrapper.innerHTML = config.html();
                    
                    // 只在需要历史数据的页面触发，且内部会做防重处理
                    if (pageKey !== 'home' && pageKey !== 'sx') {
                        await HistoryDataModule.init(); 
                    }
                    
                    // 强制从 UI 按钮状态获取当前数据源并更新 rawData
                    const activeBtn = document.querySelector('.source-sub-btn.active');
                    const currentKey = activeBtn ? activeBtn.dataset.key : 'new';
                    
                    const safeGet = (key) => {
                        const map = { new: window.xa6Data, old: window.a6Data, fag: window.hk6Data };
                        return map[key] ?? '';
                    };

                    if (typeof rawData !== 'undefined') {
                        rawData = safeGet(currentKey);
                    }

                    config.init();
                } else {
                    changePage('home');
                }

                setTimeout(() => {
                    document.querySelectorAll(`.btn-${pageKey}`).forEach(el => el.classList.add('active'));
                }, 0);
            }

            document.addEventListener('DOMContentLoaded', () => {
                // 页面刚打开时主动触发一次预加载
                HistoryDataModule.init(); 
                changePage('home');
            });

            window.changePage = changePage;
        })();
    </script>
</body>

</html>
